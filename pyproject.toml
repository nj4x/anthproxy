[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anthproxy"
version = "0.1.0"
description = "Standalone Anthropic-to-AWS Bedrock HTTP proxy"
requires-python = ">=3.10"
dependencies = ["botocore>=1.31.0"]

[project.optional-dependencies]
dev = ["ruff>=0.8.0"]

[project.scripts]
anthproxy = "anthproxy.__main__:main"

[tool.setuptools.packages.find]
include = [
    "anthproxy",
    "anthproxy._shared*",
    "anthproxy.anthropic*",
    "anthproxy.bedrock*",
    "anthproxy.codex*",
    "anthproxy.local*",
    "anthproxy.mapper*",
    "anthproxy.openrouter*",
]

[tool.ruff]
target-version = "py310"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]
